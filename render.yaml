# =============================================================
# Render Blueprint Configuration
# =============================================================
# NETWORK ISOLATION: Render does not natively block public
# internet traffic on web services. Instead, this frontend is
# deployed as a public web service and proxied behind Cloudflare.
# Cloudflare WAF IP allowlisting restricts access to only
# corporate VPN / office IP ranges.
#
# Setup:
#   1. Deploy this service to Render
#   2. Point your domain's nameservers to Cloudflare
#   3. In Cloudflare: DNS > proxy is ON for the service hostname
#   4. In Cloudflare: Security > WAF > IP Access Rules > allow corporate IPs
#   5. In Cloudflare: Security > WAF > create a Block rule for "All other traffic"
# =============================================================

services:
  # ── Frontend (Docker) ──────────────────────────────────────
  - type: web
    name: azure-cost-dashboard
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: AUDIT_WEBHOOK_URL
        sync: false  # set in Render dashboard
